[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
[project]
name = "rktermin-visa-monitor"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["requests==2.32.5", "beautifulsoup4==4.14.2", "tzdata==2025.2"]
[project.optional-dependencies]
ocr = ["Pillow==12.0.0", "opencv-python-headless==4.12.0.88", "pytesseract==0.3.13"]
test = ["pytest==8.4.2", "responses==0.25.8", "PyYAML==6.0.3"]
[project.scripts]
visa-monitor = "visa_monitor.main:main"
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
testpaths = ["tests"]
