name: Reset monitor scheduler
on:
  push:
    branches: [main]
    paths: [.github/workflows/reset-monitor-scheduler.yml]
permissions:
  contents: read
  actions: write
jobs:
  reset:
    if: github.event.head_commit.message == 'Reset stalled monitor workflow'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Reset workflow and verify active state
        env:
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import json
          import os
          import time
          from urllib.request import Request, urlopen
          from urllib.error import HTTPError, URLError

          target = "https://api.github.com/repos/BerkeEmerce/rktermin-visa-monitor/actions/workflows/415360036"
          def call(method, suffix="", payload=None):
              request = Request(target + suffix, method=method,
                  data=json.dumps(payload).encode() if payload is not None else None,
                  headers={"Authorization": "Bearer " + os.environ["GH_TOKEN"],
                           "Accept": "application/vnd.github+json",
                           "Content-Type": "application/json",
                           "X-GitHub-Api-Version": "2022-11-28"})
              with urlopen(request, timeout=20) as response:
                  data = response.read()
                  return json.loads(data) if data else None

          try:
              # Confirm enable permission before touching the active workflow.
              call("PUT", "/enable")
              try:
                  call("PUT", "/disable")
                  print("Workflow disabled for reset.")
              finally:
                  for attempt in range(3):
                      try:
                          call("PUT", "/enable")
                          print("Workflow re-enabled.")
                          break
                      except (HTTPError, URLError, OSError):
                          if attempt == 2:
                              raise
                          time.sleep(1)
              state = call("GET")["state"]
              if state != "active":
                  raise RuntimeError("Workflow did not return to active state.")
              print("VERIFIED: monitor workflow is active after reset.")
              call("POST", "/dispatches", {"ref": "main", "inputs": {"mode": "monitor", "initialize_state": False}})
              print("Catch-up monitor run dispatched. This is a manual recovery run, not proof of cron.")
          except HTTPError as error:
              raise SystemExit("GitHub API reset failed with HTTP " + str(error.code))
          except (URLError, OSError):
              raise SystemExit("GitHub API reset could not be completed.")
