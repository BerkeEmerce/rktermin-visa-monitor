name: Stop abandoned visa monitor
on:
  push:
    branches: [main]
    paths: [.github/workflows/stop-monitor.yml]
permissions:
  contents: read
  actions: write
jobs:
  stop:
    if: github.event.head_commit.message == 'Disable abandoned visa monitor'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Disable monitoring and cancel any active checks
        env:
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import json
          import os
          from urllib.request import Request, urlopen
          from urllib.error import HTTPError

          base = "https://api.github.com/repos/BerkeEmerce/rktermin-visa-monitor/"
          def call(method, path):
              req = Request(base + path, method=method, headers={
                  "Authorization": "Bearer " + os.environ["GH_TOKEN"],
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28"})
              with urlopen(req, timeout=20) as response:
                  data = response.read()
                  return json.loads(data) if data else None

          target = "actions/workflows/415360036"
          call("PUT", target + "/disable")
          state = call("GET", target)["state"]
          if state != "disabled_manually":
              raise SystemExit("Could not verify disabled monitor.")
          print("VERIFIED: automatic monitor is disabled.")
          runs = call("GET", target + "/runs?per_page=100")["workflow_runs"]
          for run in runs:
              if run["status"] != "completed":
                  try:
                      call("POST", "actions/runs/" + str(run["id"]) + "/cancel")
                      print("Cancelled active monitor run " + str(run["id"]))
                  except HTTPError as error:
                      if error.code not in (409, 422):
                          raise
          print("Shutdown completed. No future scheduled monitoring or appointment alerts.")
