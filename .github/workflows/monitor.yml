name: Visa appointment monitor
on:
  push:
    branches: [main]
    paths: [.github/workflows/monitor.yml]
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [monitor, diagnostic]
        default: monitor
        description: Monitor with saved history, or diagnostic
      initialize_state:
        type: boolean
        default: false
        description: Initialize state once (manual monitor only)
permissions:
  contents: write
  actions: read
concurrency:
  group: visa-monitor
  cancel-in-progress: false
jobs:
  check:
    if: >-
      github.event.repository.private == false &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      (github.event_name == 'workflow_dispatch' || vars.MONITOR_ENABLED == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      LOCATION_CODE: ${{ vars.LOCATION_CODE || 'niko' }}
      REALM_ID: ${{ vars.REALM_ID || '926' }}
      CATEGORY_ID: ${{ vars.CATEGORY_ID || '1860' }}
      LOCATION_NAME: ${{ vars.LOCATION_NAME || 'North Nicosia' }}
      TIMEZONE: ${{ vars.TIMEZONE || 'Asia/Nicosia' }}
      MONTHS_TO_CHECK: '3'
      CHECK_INTERVAL_MINUTES: ${{ vars.CHECK_INTERVAL_MINUTES || '60' }}
      MAX_CAPTCHA_ATTEMPTS: '2'
      REQUEST_TIMEOUT_SECONDS: '20'
      CAPTCHA_MODE: ${{ vars.CAPTCHA_MODE || '2captcha' }}
      OCR_ENGINE: ${{ vars.OCR_ENGINE || 'tesseract' }}
      CAPTCHA_EXPECTED_LENGTH: ${{ vars.CAPTCHA_EXPECTED_LENGTH || '6' }}
      OCR_PERMISSION_CONFIRMED: ${{ vars.OCR_PERMISSION_CONFIRMED || 'false' }}
      FAILURE_ALERT_THRESHOLD: ${{ vars.FAILURE_ALERT_THRESHOLD || '3' }}
      STALE_AFTER_HOURS: ${{ vars.STALE_AFTER_HOURS || '6' }}
      OPERATIONAL_ALERT_HOURS: ${{ vars.OPERATIONAL_ALERT_HOURS || '24' }}
      ACCESS_COOLDOWN_HOURS: ${{ vars.ACCESS_COOLDOWN_HOURS || '24' }}
      DAILY_SUMMARY: 'false'
      DRY_RUN: 'false'
      AUTO_BOOK: 'false'
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      CAPTCHA_API_KEY: ${{ secrets.CAPTCHA_API_KEY }}
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ vars.SMTP_PORT || '465' }}
      SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
      EMAIL_TO: 'berkeemerce@gmail.com'
      GH_TOKEN: ${{ github.token }}
      MODE: ${{ inputs.mode || 'monitor' }}
      INITIALIZE: ${{ inputs.initialize_state && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v4
        id: checkout
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore Python dependency downloads
        id: pip-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-python312-${{ env.CAPTCHA_MODE }}-${{ env.OCR_ENGINE }}-${{ hashFiles('pyproject.toml') }}
      - name: Install Python dependencies
        run: python -m pip install .
      - name: Install optional local OCR
        if: env.CAPTCHA_MODE == 'ocr' && env.OCR_PERMISSION_CONFIRMED == 'true'
        run: |
          if [[ "$OCR_ENGINE" == 'neural' ]]; then
            python -m pip install '.[neural]'
          else
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends tesseract-ocr
            python -m pip install '.[ocr]'
          fi
      - name: Save dependency downloads before checking the portal
        if: steps.pip-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/pip
          key: ${{ steps.pip-cache.outputs.cache-primary-key }}
      - name: Run selected mode
        shell: bash
        run: |
          set -euo pipefail
          case "$MODE" in
            diagnostic) python -m visa_monitor.main diagnostic ;;
            monitor)
              args=(check --github-state)
              if [[ "$INITIALIZE" == 'true' ]]; then args+=(--initialize-state); fi
              python -m visa_monitor.main "${args[@]}"
              ;;
            *) exit 2 ;;
          esac | tee monitor-result.jsonl
      - name: Archive run history
        if: always() && steps.checkout.outcome == 'success'
        run: python scripts/publish_run_log.py
