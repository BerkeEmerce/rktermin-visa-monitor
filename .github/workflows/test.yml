name: Tests
on:
  push:
    branches-ignore: [monitor-state]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      matrix:
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install '.[test,ocr]'
      - run: python -m pytest -q
      - name: Check dashboard JavaScript
        run: node --check dashboard/dist/app.js
