name: Nicosia upstream visa monitor
run-name: Nicosia check · ${{ inputs.trigger_source || github.event_name }}
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/nicosia-upstream.yml'
      - 'vendor/visa-termin-master/**'
  workflow_dispatch:
    inputs:
      trigger_source:
        type: choice
        options: [manual, cron-job.org]
        default: manual
        description: Which scheduler started this check
permissions:
  contents: read
concurrency:
  group: nicosia-upstream-monitor
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    defaults:
      run:
        working-directory: vendor/visa-termin-master
    env:
      LOCATION_CODE: niko
      REALM_ID: '926'
      CATEGORY_ID: '1860'
      EMBASSY_LOCATION: niko
      EARLIEST_DATE: ''
      LATEST_DATE: ''
      ACCEPTED_WEEKDAYS: ''
      AUTO_BOOK: 'false'
      BOOKING_DRY_RUN: 'true'
      CAPTCHA_MAX_ATTEMPTS: '3'
      CAPTCHA_API_KEY: ${{ secrets.CAPTCHA_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ vars.SMTP_PORT || '465' }}
      SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
      EMAIL_TO: berkeemerce2002@gmail.com
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install beautifulsoup4==4.15.0 requests==2.34.2
      - name: Run notification-only check
        run: python monitor_nicosia.py
      - name: Keep sanitized check result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nicosia-result-${{ github.run_id }}-${{ github.run_attempt }}
          path: vendor/visa-termin-master/result.json
          if-no-files-found: ignore
          retention-days: 7
