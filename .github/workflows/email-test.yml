name: Email delivery test
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/email-test.yml
permissions:
  contents: read
concurrency:
  group: visa-email-delivery-test
  cancel-in-progress: false
jobs:
  send:
    if: >-
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      (github.event_name == 'workflow_dispatch' || github.event.head_commit.message == 'Send requested test email')
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Send one labeled test email
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ vars.SMTP_PORT || '465' }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
        run: python scripts/send_test_email.py
